name: Workflow maintenance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint all workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check runtime and runner policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          known = {"actions/checkout":"3d3c42e5aac5ba805825da76410c181273ba90b1","actions/github-script":"3a2844b7e9c422d3c10d287c895573f7108da1b3","GrantBirki/comment":"937820f3623fd0e300294bcc64ac7577fc0ad4cc","peter-evans/find-comment":"b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad","skills/action-keyphrase-checker":"4771c016e1a66082db6bff148136b82689f7bd84","skills/action-text-variables":"d277ce34621ab00a53db0517d18304a7032453c5","EndBug/add-and-commit":"cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8"}
          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text()
              assert "ubuntu-" + "latest" not in text, path
              for ref in re.findall(r"^\s*(?:-\s*)?uses:\s*(\S+)", text, re.M):
                  if ref.startswith("./"):
                      assert Path(ref[2:]).is_file(), (path, ref)
                  else:
                      action, sha = ref.rsplit("@", 1)
                      assert known.get(action) == sha, (path, ref)
          print("All workflow actions use verified Node.js 24 revisions; runners are pinned.")
          PY
      - name: Verify Node.js 24 execution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!process.version.startsWith('v24.')) {
              core.setFailed('Expected the Node.js 24 action runtime');
            }
      - name: Smoke test lesson keyphrase action
        uses: skills/action-keyphrase-checker@4771c016e1a66082db6bff148136b82689f7bd84 # v2.0.0
        with:
          text: "Runtime compatibility smoke test"
          keyphrase: "compatibility"
          minimum-occurrences: 1
      - name: Checkout the lesson templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skills/exercise-toolkit
          ref: 904f29a5aa21fb6ccd0ecbbd5e7b668fd92b9ff1 # v0.9.3
          path: exercise-toolkit
          persist-credentials: false
      - name: Render actual passing results
        id: pass
        uses: skills/action-text-variables@d277ce34621ab00a53db0517d18304a7032453c5 # v4.0.1
        with:
          template-file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          template-vars: |
            step_number: 1
            results_table:
              - description: runtime
                passed: true
      - name: Render actual failing results
        id: fail
        uses: skills/action-text-variables@d277ce34621ab00a53db0517d18304a7032453c5 # v4.0.1
        with:
          template-file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          template-vars: |
            step_number: 1
            results_table:
              - description: runtime
                passed: false
      - name: Render actual started README
        id: started
        uses: skills/action-text-variables@d277ce34621ab00a53db0517d18304a7032453c5 # v4.0.1
        with:
          template-file: exercise-toolkit/markdown-templates/readme/exercise-started.md
          template-vars: |
            title: Runtime smoke test
            login: learner
            issue_url: https://github.com/${{ github.repository }}/issues/1
      - name: Render actual completed README
        id: finished
        uses: skills/action-text-variables@d277ce34621ab00a53db0517d18304a7032453c5 # v4.0.1
        with:
          template-file: exercise-toolkit/markdown-templates/readme/exercise-finished.md
          template-vars: |
            login: learner
            exercise_title: Runtime smoke test
            repository_url: https://github.com/${{ github.repository }}
            issue_url: https://github.com/${{ github.repository }}/issues/1
      - name: Verify actual rendered templates
        env:
          PASS_RESULT: ${{ steps.pass.outputs.updated-text }}
          FAIL_RESULT: ${{ steps.fail.outputs.updated-text }}
          STARTED_README: ${{ steps.started.outputs.updated-text }}
          FINISHED_README: ${{ steps.finished.outputs.updated-text }}
          ISSUE_URL: https://github.com/${{ github.repository }}/issues/1
        run: |
          [[ "$PASS_RESULT" == *"Step 1 - Passed"* ]]
          [[ "$PASS_RESULT" == *"✅ - Pass | runtime"* ]]
          [[ "$FAIL_RESULT" == *"Step 1 - Fail"* ]]
          [[ "$FAIL_RESULT" == *"❌ - Fail | runtime"* ]]
          [[ "$STARTED_README" == *"$ISSUE_URL"* ]]
          [[ "$FINISHED_README" == *"$ISSUE_URL"* ]]
