# Maintained action runtimes, runners, job permissions and failure ordering.
# Nunjucks templates pinned to toolkit v0.9.3; practical checks and lesson interface retained.
name: Start Exercise

on:
  workflow_call:
    inputs:
      exercise-title:
        description: "Title of the exercise"
        required: true
        type: string
      issue-title-prefix:
        description: "Prefix for the exercise title in the issue"
        required: false
        type: string
        default: "Exercise: "
      intro-message:
        description: "Introduction message for the exercise"
        required: true
        type: string
    outputs:
      issue-url:
        description: "URL of the created issue"
        value: ${{ jobs.create_exercise.outputs.issue-url }}
      issue-number:
        description: "Number of the created issue"
        value: ${{ jobs.create_exercise.outputs.issue-number }}

permissions: {}

env:
  EXERCISE_TOOLKIT_REF: 904f29a5aa21fb6ccd0ecbbd5e7b668fd92b9ff1

jobs:
  disable_workflows:
    permissions:
      contents: read # List exercise workflow files.
      actions: write # Disable the exercise workflows.
    name: Disable exercise workflows
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disable all exercise workflows
        run: |
          # Find all workflow files that start with a number (0-9)
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$')
          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            echo "Disabling workflow: $workflow_name"
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_name" --jq '.state')"
            case "$state" in
              active)
                gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_name/disable"
                ;;
              disabled_*)
                echo "Workflow already disabled: $workflow_name"
                ;;
              *)
                echo "Unexpected workflow state: $state" >&2
                exit 1
                ;;
            esac
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_exercise:
    needs: disable_workflows
    permissions:
      contents: write # Update the exercise README.
      issues: write # Create the exercise issue.
    name: Create exercise issue and update README
    runs-on: ubuntu-24.04

    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for the following README commit and push.
      - name: Get response templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for the following README commit and push.
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: ${{ env.EXERCISE_TOOLKIT_REF }}

      - name: Get template repository
        id: get-template-repo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            if (repo.template_repository) {
              console.log(`Template repository found: ${repo.template_repository.full_name}`);
              const issueReportUrl = `https://github.com/${repo.template_repository.full_name}/issues`;
              core.setOutput('ISSUE_REPORT_URL', issueReportUrl);
              core.setOutput('TEMPLATE_REPOSITORY', repo.template_repository.full_name);

            } else {
              console.log('No template repository found for this repository');
            }

      - name: Find and replace image URLs in step files
        if: steps.get-template-repo.outputs.TEMPLATE_REPOSITORY != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_FILES_GLOB: .github/steps/*.md
        with:
          script: |
            const fs = require('fs');

            const globber = await glob.create(process.env.STEP_FILES_GLOB);
            const files = await globber.glob();

            files.forEach(file => {
              const content = fs.readFileSync(file, 'utf8');

              // Replace ../images/* links with GitHub blob URLs suffixed with ?raw=true.
              const updatedContent = content.replace(
                /\.\.\/images\/([^\s)"']+)/g,
                'https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/images/$1?raw=true'
              );

              if (content !== updatedContent) {
                fs.writeFileSync(file, updatedContent, 'utf8');
              }
            });
      
      - name: Build welcome message from template
        id: build-issue-description
        uses: skills/action-text-variables@d277ce34621ab00a53db0517d18304a7032453c5 # v4.0.1
        with:
          template-file: exercise-toolkit/markdown-templates/step-feedback/welcome.md
          template-vars: |
            title: ${{ inputs.exercise-title }}
            login: ${{ github.actor }}
            intro_message: ${{ inputs.intro-message }}
            bug_report_url: ${{ steps.get-template-repo.outputs.ISSUE_REPORT_URL || '' }}

      - name: Create issue - add welcome message
        id: create-issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${process.env.ISSUE_TITLE_PREFIX}${process.env.EXERCISE_TITLE}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);
        env:
          ISSUE_BODY: ${{ steps.build-issue-description.outputs.updated-text }}
          EXERCISE_TITLE: ${{ inputs.exercise-title }}
          ISSUE_TITLE_PREFIX: ${{ inputs.issue-title-prefix }}

      
      - name: Build welcome message from template
        id: build-new-readme
        uses: skills/action-text-variables@d277ce34621ab00a53db0517d18304a7032453c5 # v4.0.1
        with:
          template-file: exercise-toolkit/markdown-templates/readme/exercise-started.md
          template-vars: |
            title: ${{ inputs.exercise-title }}
            login: ${{ github.actor }}
            issue_url: ${{ steps.create-issue.outputs.ISSUE_URL }}

      - name: Overwrite README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: "README.md .github/steps/*.md"
          message: "Start exercise"
          default_author: github_actions