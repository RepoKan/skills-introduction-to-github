# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  review_status: true
  review_progress: true
  commit_status: true
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
  auto_approvals:
    enabled: true
  path_instructions:
    - path: ".github/**"
      instructions: |
        Preserve the completed GitHub Skills lesson, exact exercise branches,
        practical checks, and file paths. Check direct and transitive action
        runtimes, pinned runners, least privilege, and reusable workflow inputs.
        Do not hide warnings or treat skipped/cancelled reviews as passed.
